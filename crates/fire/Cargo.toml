[package]
name = "fire"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Builds the `fire` executable — the whole viewer (window, render, decode pool, instance socket).
# The default bin (package name + src/main.rs) needs no [[bin]] section.

# Pass-throughs to `fire-decode`'s native decoders, on by default — the shipped exe reads PSD
# and HEIF/AVIF. `--no-default-features` builds the viewer without the vendored native trees,
# which is how CI checks the whole shell on a runner that has none.
[features]
default = ["psd", "heif"]
psd = ["fire-decode/psd"]
heif = ["fire-decode/heif"]

[dependencies]
fire-ipc.workspace = true
fire-decode.workspace = true

serde.workspace = true
toml.workspace = true

# crossbeam-channel carries decode results from the worker pool to the UI thread.
crossbeam-channel.workspace = true

# notify watches the open image's directory so it hot-reloads when the file changes on disk
# (ReadDirectoryChangesW on Windows, FSEvents on macOS); see watcher.rs.
notify.workspace = true

# The shared shell: winit (window, event loop, input, DPI, drag-and-drop, theme), sokol_gfx (one
# drawing API over the D3D11 device and swapchain `render::d3d11` creates), Dear ImGui through
# dear-imgui-winit (input) and sokol_imgui (rendering, compiled in build.rs).
winit.workspace = true
sokol.workspace = true
dear-imgui-rs.workspace = true
dear-imgui-winit.workspace = true

# Instance coordination (named pipe / Unix socket), the config directory, the open-file dialog.
interprocess.workspace = true
dirs.workspace = true
rfd.workspace = true

# The remaining Win32 leaves (see `platform.rs`): the one-shot foreground grant on the forward
# path, the clipboard (Copy File / Path / Name), and the launcher's Run = Maximized/Minimized.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",        # clipboard (Copy File / Path / Name from the actions menu)
    "Win32_System_Memory",              # GlobalAlloc/Lock for the clipboard payloads
    "Win32_System_Threading",           # GetStartupInfoW (the launcher's Run setting)
    "Win32_UI_Shell",                   # DROPFILES for the CF_HDROP clipboard payload
    "Win32_UI_WindowsAndMessaging",     # AllowSetForegroundWindow, SW_* show commands
] }
# The D3D11 device and DXGI flip-model swapchain sokol_gfx draws through (render::d3d11). The
# typed crate (vs raw windows-sys) makes the COM calls tractable; nothing else names it.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",          # D3D_DRIVER_TYPE / feature levels
    "Win32_Graphics_Direct3D11",        # ID3D11Device / context / render-target view
    "Win32_Graphics_Dxgi",              # IDXGIFactory2 / swapchain / device / adapter
    "Win32_Graphics_Dxgi_Common",       # DXGI_FORMAT / sample desc
] }

[build-dependencies]
# build.rs reads the canonical product metadata from ../../product.json so a single edit there
# flows into the exe's version resource and the FIRE_* compile-time strings the app displays.
serde_json.workspace = true
# build.rs rasterizes the toolbar SVGs (../../assets/icons/) to A8 coverage masks (one master
# per icon, embedded via include_bytes!); the icon module downsamples them per-DPI at runtime.
resvg.workspace = true
# build.rs compiles sokol_imgui.h (simgui/) as C against the vendored sokol headers and cimgui.
cc.workspace = true

[target.'cfg(windows)'.build-dependencies]
# Embeds the Fire .ico + product metadata into the exe (Explorer file icon, file properties).
winresource.workspace = true

[lints]
workspace = true
