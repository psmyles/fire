[package]
name = "fire-thumbs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Explorer thumbnails, minus the COM. Everything both sides of the feature share: the
# `[thumbnails]` settings table, the per-format table, the CPU render (decoded image → thumbnail
# bitmap) and, on Windows, the HKCU registration and the thumbnail-cache purge. `fire` builds the
# Settings tab and the installer's `--set-thumbnails` on it; `fire-shellext` (the DLL Explorer
# loads) builds the provider on it.
#
# No decoder features of its own: `fire-decode` comes in with the workspace's
# `default-features = false`, and whichever artifact links this — `fire.exe`, the DLL — turns PSD
# and HEIF back on for the whole build, the same way `fire` always has.

[dependencies]
fire-decode.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
half.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",                           # CoCreateInstance, for the cache purge
    "Win32_System_Registry",                      # the HKCU registration
    "Win32_Security",                             # RegCreateKeyExW's (unused) security attributes
    "Win32_UI_Shell",                             # SHChangeNotify
    "Win32_UI_LegacyWindowsEnvironmentFeatures",  # IEmptyVolumeCache — Disk Cleanup's handler
] }

[lints]
workspace = true
