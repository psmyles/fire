# CI for fire. Two hosts, because the app has two: Windows (Win32 leaves + D3D11) and macOS
# (AppKit leaves + Metal). Both legs are mandatory rather than nice-to-have — clippy on Windows
# never sees `render/metal.rs`, `openfiles.rs` or `menubar.rs`, and clippy on macOS never sees
# `render/d3d11.rs` or the `windows-sys` leaves, so a single-host CI cannot keep the workspace
# lint-clean now that both leaves exist (D23).
#
# The one thing that makes this workflow non-obvious is the *vendored native artifacts*. `heif-sys`
# links prebuilt static libs (heif/libde265/dav1d) and `psd-sdk-sys` compiles the psd_sdk C++ source,
# and neither is in the Rust crate graph — they are fetched per `vendor/VENDOR.txt`. They are also
# not in the repository. Those two crates are reached only through `fire-decode`'s `psd` / `heif`
# features (default-on, so the shipped exe is unaffected), which is what lets the job split be:
#
#   * `check` always runs, with `--no-default-features`: no psd_sdk, no libheif, and so no bindgen
#     or LLVM either. That covers everything else — `fire-ipc`, the pure-Rust decode core, and the
#     whole shell including `fire`'s pure-logic modules (view/config/keybinds/flipbook/ui).
#   * `full` runs only when the vendor tree is present (a cached restore, or a self-hosted runner
#     with it checked out). It adds the native decoders: the real binary and the PSD/HEIF
#     end-to-end tests.
#
# Without that split, a fork's first push would fail on a missing `heif.lib` and teach everyone to
# ignore the badge. Without the features, `check` could only ever have covered `fire-ipc` — every
# other crate pulls the vendored trees in transitively, so a cache miss meant a green badge over
# code nothing had linted.
#
# Per D11 this workflow stops at build-and-test on macOS: it never signs, notarizes or packages a
# `.dmg`. That runs only on the dev Mac via `scripts/build-mac.sh`, so the Developer ID certificate
# and the App Store Connect key never need to exist as CI secrets on a public repo.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a CI failure costs nothing and saves a round-trip.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: clippy + tests (no native decoders, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One host's failure should not hide the other's: the whole point of two legs is that each
      # sees code the other cannot compile.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `fire`'s build.rs precompiles the Metal shader offline (D24), so even the decoder-free
      # build needs the Metal toolchain — which since Xcode 26 is an optional ~700 MB component
      # that some runner images ship and some do not. Test it by *running* it: `xcrun --find metal`
      # succeeds either way, because what it finds without the toolchain is a stub that fails at
      # use (§7.1). Downloading is the slow path, taken only when the image lacks it.
      - name: Ensure the Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal toolchain present: $(xcrun -sdk macosx metal --version 2>&1 | head -1)"
          else
            echo "::notice::Metal toolchain absent from this image — downloading it (~700 MB)."
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      # Everything except the two FFI decoders, so this needs no vendored input and no LLVM.
      - name: Clippy (no native decoders)
        run: cargo clippy -p fire-ipc -p fire-decode -p fire --no-default-features --all-targets -- -D warnings

      # `fire-ipc` is dependency-free and holds the instance-socket wire format — the one place
      # that parses bytes from outside the process. It must always be tested.
      - name: Test (fire-ipc)
        run: cargo test -p fire-ipc

      # The pure-Rust decoders (PNG/JPEG/GIF/TIFF/EXR/HDR/raw), the decode-bomb guards, and the
      # extension-table drift test that keeps installer/fire.iss honest.
      - name: Test (fire-decode, no native decoders)
        run: cargo test -p fire-decode --no-default-features

      # The shell's pure-logic modules: view math, config round-trip, keybinds, flipbook
      # detection, folder navigation, theme parsing, icon ordering.
      - name: Test (fire, no native decoders)
        run: cargo test -p fire --no-default-features

  full:
    name: clippy + tests (full workspace, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # The vendored heif tree is per-target (D25); this is the subdirectory and the one
            # library file whose presence stands for "the tree was restored".
            heif_lib: crates/heif-sys/vendor/x64-windows/lib/heif.lib
          - os: macos-latest
            heif_lib: crates/heif-sys/vendor/arm64-macos/lib/libheif.a
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Ensure the Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal toolchain present: $(xcrun -sdk macosx metal --version 2>&1 | head -1)"
          else
            echo "::notice::Metal toolchain absent from this image — downloading it (~700 MB)."
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      # bindgen needs libclang. Windows has none by default; macOS ships one inside Xcode and
      # `clang-sys` finds it unaided, so there is nothing to install there.
      - name: Install LLVM (libclang, for bindgen in psd-sdk-sys / heif-sys)
        if: runner.os == 'Windows'
        run: choco install llvm --no-progress -y

      # The vendored artifacts are large and licence-encumbered, so they are not committed. Restore
      # them from cache if a previous run populated it; otherwise this job reports that it skipped,
      # rather than failing with a link error nobody can act on.
      #
      # The key carries the runner OS: the arm64 `.a`s and the x64 `.lib`s are different artifacts
      # built from the same recipe, so one key for both would have each host restoring the other's
      # and failing to link.
      - name: Restore vendored native artifacts
        id: vendor
        uses: actions/cache/restore@v4
        with:
          path: |
            crates/heif-sys/vendor
            crates/psd-sdk-sys/vendor
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/*/vendor/VENDOR.txt') }}

      - name: Check the vendor tree is present
        id: have_vendor
        shell: bash
        run: |
          if [ -f "${{ matrix.heif_lib }}" ] && [ -d crates/psd-sdk-sys/vendor/Psd ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vendored native artifacts absent — skipping the full build."
            echo "::notice::Populate them per crates/*/vendor/VENDOR.txt to enable this job."
          fi

      # `--workspace` covers the five crates in `[workspace] members`. `vendor/sokol-rust` is a
      # path dependency inside the workspace directory and so was a member by default; it is
      # excluded in the root manifest, because linting a pinned upstream tree to our standard
      # fails on upstream's style and there is nothing to fix on our side.
      - name: Clippy (workspace)
        if: steps.have_vendor.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Adds what `check` cannot reach: the PSD C++ FFI fixtures and the HEIF/AVIF containers.
      - name: Test (workspace)
        if: steps.have_vendor.outputs.present == 'true'
        run: cargo test --workspace

      # Build only. Signing, notarization and the .dmg are the dev Mac's, not CI's (D11).
      - name: Build release binary
        if: steps.have_vendor.outputs.present == 'true'
        run: cargo build -p fire --release
