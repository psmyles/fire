# CI for fire. Two hosts, because the app has two: Windows (Win32 leaves + D3D11) and macOS
# (AppKit leaves + Metal). Both legs are mandatory rather than nice-to-have — clippy on Windows
# never sees `render/metal.rs`, `openfiles.rs` or `menubar.rs`, and clippy on macOS never sees
# `render/d3d11.rs` or the `windows-sys` leaves, so a single-host CI cannot keep the workspace
# lint-clean now that both leaves exist (D23).
#
# The decoder is fire-decode, a git dependency at a release tag (Cargo.lock records it). It brings
# its native code with it: psd_sdk's C++ source, compiled by `cc`, and the HEIF stack's prebuilt
# static libraries for both targets, with committed bindings (no bindgen, so no LLVM). Its own
# tests run in its own CI; this workflow tests fire. Two jobs:
#
#   * `check`, with `--no-default-features`: no psd_sdk and no libheif. It lints and tests the
#     build that leaves the native decoders out, which no other job compiles: `fire-ipc` and the
#     whole shell, including `fire`'s pure-logic modules (view/config/keybinds/flipbook/ui).
#   * `full`: the workspace with its default features, the native decoders included. The real
#     binaries and the PSD / HEIF end-to-end tests.
#
# Every cargo command is `--locked`. A Cargo.lock written while a local `[patch]` pointed
# fire-decode at a checkout names a path, not the tag, and fails here rather than quietly building
# against whatever the tag resolves to today.
#
# Per D11 this workflow stops at build-and-test on macOS: it never signs, notarizes or packages a
# `.dmg`. That runs only on the dev Mac via `scripts/build-mac.sh`, so the Developer ID certificate
# and the App Store Connect key never need to exist as CI secrets on a public repo.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a CI failure costs nothing and saves a round-trip.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: clippy + tests (no native decoders, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One host's failure should not hide the other's: the whole point of two legs is that each
      # sees code the other cannot compile.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `fire`'s build.rs precompiles the Metal shader offline (D24), so even the decoder-free
      # build needs the Metal toolchain — which since Xcode 26 is an optional ~700 MB component
      # that some runner images ship and some do not. Test it by *running* it: `xcrun --find metal`
      # succeeds either way, because what it finds without the toolchain is a stub that fails at
      # use (§7.1). Downloading is the slow path, taken only when the image lacks it.
      - name: Ensure the Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal toolchain present: $(xcrun -sdk macosx metal --version 2>&1 | head -1)"
          else
            echo "::notice::Metal toolchain absent from this image — downloading it (~700 MB)."
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      # Everything without the two FFI decoders.
      - name: Clippy (no native decoders)
        run: cargo clippy --locked -p fire-ipc -p fire-thumbs -p fire-shellext -p fire -p fire-cli --no-default-features --all-targets -- -D warnings

      # `fire-ipc` is dependency-free and holds the instance-socket wire format — the one place
      # that parses bytes from outside the process. It must always be tested.
      - name: Test (fire-ipc)
        run: cargo test --locked -p fire-ipc

      # Explorer thumbnails: the CPU render, the settings table, and the two drift tests that hold
      # installer/fire.iss's thumbnails page and class id to the crate. On Windows also the HKCU
      # registration round trips, on throwaway extensions they clean up after.
      - name: Test (fire-thumbs)
        run: cargo test --locked -p fire-thumbs

      # The shell's pure-logic modules: view math, config round-trip, keybinds, flipbook
      # detection, folder navigation, theme parsing, icon ordering; and the drift test that keeps
      # installer/fire.iss's extension table to fire-decode's (tests/installer.rs).
      - name: Test (fire, no native decoders)
        run: cargo test --locked -p fire --no-default-features

      # Asset Check's image checker: its rules, the results it writes, and `--staged` in a scratch
      # git repository (git is on every runner). The PSD fixture needs the native decoder and runs
      # in `full`.
      - name: Test (fire-cli, no native decoders)
        run: cargo test --locked -p fire-cli --no-default-features

  full:
    name: clippy + tests (full workspace, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Ensure the Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal toolchain present: $(xcrun -sdk macosx metal --version 2>&1 | head -1)"
          else
            echo "::notice::Metal toolchain absent from this image — downloading it (~700 MB)."
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      # `--workspace` covers the five crates in `[workspace] members`. `vendor/sokol-rust` is a
      # path dependency inside the workspace directory and so was a member by default; it is
      # excluded in the root manifest, because linting a pinned upstream tree to our standard
      # fails on upstream's style and there is nothing to fix on our side.
      # On Windows the static CRT (FD20) comes from .cargo/config.toml; fire-decode's HEIF
      # libraries need it, and stop the build with a named error without it.
      - name: Clippy (workspace)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Adds what `check` cannot reach: PSD and HEIF / AVIF through the native decoders.
      - name: Test (workspace)
        run: cargo test --locked --workspace

      # Build only. Signing, notarization and the .dmg are the dev Mac's, not CI's (D11).
      - name: Build release binary
        run: cargo build --locked -p fire -p fire-cli -p fire-shellext --release
